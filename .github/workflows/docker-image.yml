name: Docker image
run-name: VOZEB image - ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full source commit on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vozeb-image-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'cserror/VOZEB-PRO' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main
          git cat-file -e "$SOURCE_SHA:scripts/release/manifest.test.mjs"
          # This pilot changes build materials only, not the deployed business baseline.
          BASELINE=61a5c2f6bee5fa6c4e66f662d143ea01bbab2e65
          git merge-base --is-ancestor "$BASELINE" "$SOURCE_SHA"
          git diff --exit-code "$BASELINE" "$SOURCE_SHA" -- . \
            ':(exclude)Dockerfile' ':(exclude).dockerignore' \
            ':(exclude).github/workflows/*' ':(exclude)scripts/release/*' \
            ':(exclude)deploy/docker-compose.image.yml' \
            ':(exclude)web/scripts/release-workflow-contract.test.mjs' \
            ':(exclude)PROJECT_CONTEXT.md'
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  quality:
    needs: validate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/quality.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  publish:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      LOCAL_IMAGE: vozeb-release:run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      PUBLISHED_REFERENCE: ghcr.io/cserror/vozeb-pro:sha-${{ needs.validate.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve immutable base images
        id: bases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for item in node:22-bookworm-slim postgres:16.6-alpine; do
            name="${item%%:*}"
            digest=$(docker buildx imagetools inspect "$item" --format '{{json .Manifest}}' | node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(0,'utf8')).digest;if(!/^sha256:[a-f0-9]{64}$/.test(d))process.exit(1);console.log(d)")
            echo "$name=$name@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Build the image to be tested and published
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/cserror/VOZEB-PRO
          build-args: |
            NODE_BASE=${{ steps.bases.outputs.node }}
            BUILD_NODE_OPTIONS=--max-old-space-size=6144
            NEXT_BUILD_CPUS=2
          cache-from: type=gha,scope=vozeb-amd64
          cache-to: type=gha,scope=vozeb-amd64,mode=max
      - name: Verify isolated final image
        env:
          POSTGRES_IMAGE: ${{ steps.bases.outputs.postgres }}
        run: |
          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
          node tooling/scripts/release/smoke.mjs "$LOCAL_IMAGE" "$POSTGRES_IMAGE" evidence/image-verification.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the already tested image
        run: |
          docker tag "$LOCAL_IMAGE" "$PUBLISHED_REFERENCE"
          docker push "$PUBLISHED_REFERENCE"
      - name: Capture immutable registry and material evidence
        env:
          NODE_BASE: ${{ steps.bases.outputs.node }}
          POSTGRES_IMAGE: ${{ steps.bases.outputs.postgres }}
        run: node tooling/scripts/release/capture.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 7

  manifest:
    needs: [validate, quality, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Verify completed jobs for this attempt and write manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > evidence/jobs.json
          node scripts/release/manifest.mjs evidence/publish-evidence.json evidence/jobs.json evidence/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 7
